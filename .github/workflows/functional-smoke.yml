name: Functional source smoke

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "overrides/**"
      - "index.min.json"
      - "inventory.json"
      - "config/source_policy.json"
      - "runtime-smoke/**"
      - "scripts/functional_smoke.py"
      - "scripts/update_sources.py"
      - "scripts/validate_catalog.py"
      - ".github/workflows/functional-smoke.yml"
  pull_request:
    paths: ["runtime-smoke/**", "scripts/functional_smoke.py", "scripts/update_sources.py", "scripts/validate_catalog.py", ".github/workflows/functional-smoke.yml", "config/source_policy.json", "overrides/**"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: functional-smoke-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_BUILD_JOBS: "2"
  RUST_FONTCONFIG_DLOPEN: "on"

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Build candidate catalog
        run: python scripts/update_sources.py
      - name: Validate candidate source bytes before execution
        run: |
          python scripts/validate_catalog.py
          git diff --check
      - name: Record critical candidate identity
        run: |
          python - <<'PY'
          import json
          wanted = {"en.comix", "en.mangadistrict", "en.readcomicsonline"}
          inventory = json.load(open("inventory.json", encoding="utf-8"))
          for item in inventory["sources"]:
              if item["id"] in wanted:
                  print(item["id"], "v" + str(item["version"]), item["sha256"], item.get("upstreamPackageURL"), item.get("provenanceURL"))
          PY
      - name: Rust toolchain identity
        id: toolchain
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore compiled runtime dependencies
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-smoke/target
          key: aidoku-runtime-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('runtime-smoke/Cargo.lock') }}-${{ hashFiles('runtime-smoke/src/**') }}
          restore-keys: aidoku-runtime-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('runtime-smoke/Cargo.lock') }}-
      - name: Build and test pinned Aidoku runtime adapter
        id: build
        run: |
          rustc --version
          cargo --version
          cargo test --locked --manifest-path runtime-smoke/Cargo.toml
          cargo build --locked --manifest-path runtime-smoke/Cargo.toml
      - name: Retain compiled runtime without requiring unprotected websites
        if: steps.build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-smoke/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Run real source exports through first-page content
        run: python scripts/functional_smoke.py --runner runtime-smoke/target/debug/aidoku-catalog-smoke
      - name: Retain functional evidence and dependency lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            acceptance/functional
            runtime-smoke/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
  report:
    needs: smoke
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.smoke.result == 'success' || needs.smoke.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Report functional failure or recovery
        run: python scripts/report_automation.py
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_RESULT: ${{ needs.smoke.result }}
          INCIDENT_KIND: functional
