name: Validate source catalogs

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "icons/**"
      - "sources/**"
      - "legacy/**"
      - "CHECKSUMS.sha256"
      - "README.md"
      - "index.json"
      - "index.min.json"
      - "inventory.json"
      - "status.json"
      - "status.md"
  push:
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "icons/**"
      - "sources/**"
      - "legacy/**"
      - "CHECKSUMS.sha256"
      - "README.md"
      - "index.json"
      - "index.min.json"
      - "inventory.json"
      - "status.json"
      - "status.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: validate-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          check-latest: false

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate published catalogs and packages
        run: python scripts/validate_catalog.py

      - name: Check whitespace errors
        run: git diff --check
