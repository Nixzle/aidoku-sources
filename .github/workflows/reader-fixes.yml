name: Build reader repair candidates
on:
  push:
    branches: [fix/comix-asura-reader-20260926]
    paths: ["source-fixes/**", "scripts/package_reader_fixes.py", "scripts/functional_smoke.py", "runtime-smoke/**", ".github/workflows/reader-fixes.yml"]
  pull_request:
    paths: ["source-fixes/**", "scripts/package_reader_fixes.py", ".github/workflows/reader-fixes.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-fixes-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: "2"
  RUST_FONTCONFIG_DLOPEN: "on"
  RUST_TOOLCHAIN: "1.98.1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Baseline and browser transport regression tests
        run: |
          python -m unittest discover -s tests
          node --test source-fixes/tests/transport.test.cjs
          python scripts/validate_catalog.py
      - name: Install pinned Rust toolchain on disposable CI runner
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Rust toolchain identity
        id: toolchain
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore reader build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-smoke/target
            source-fixes/en.comix/target
            source-fixes/en.comixws/target
            source-fixes/en.asurascans/target
          key: reader-repair-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('runtime-smoke/Cargo.lock', 'source-fixes/**/Cargo.lock') }}-${{ hashFiles('runtime-smoke/src/**', 'source-fixes/**/src/**', 'source-fixes/shared/**', 'source-fixes/**/Cargo.toml') }}
          restore-keys: reader-repair-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('runtime-smoke/Cargo.lock', 'source-fixes/**/Cargo.lock') }}-
      - name: Build locked source replacements
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path source-fixes/en.comix/Cargo.toml
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path source-fixes/en.comixws/Cargo.toml
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path source-fixes/en.asurascans/Cargo.toml
          python scripts/package_reader_fixes.py
      - name: Test actual parser and reader runtime
        id: build-runtime
        run: |
          cargo test --locked --manifest-path runtime-smoke/Cargo.toml
          cargo build --locked --manifest-path runtime-smoke/Cargo.toml
      - name: Save successful reader builds before protected-site acceptance
        if: steps.build-runtime.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-smoke/target
            source-fixes/en.comix/target
            source-fixes/en.comixws/target
            source-fixes/en.asurascans/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Execute candidate source WASM
        run: python scripts/functional_smoke.py --runner runtime-smoke/target/debug/aidoku-catalog-smoke --root reader-candidates --source en.asurascans --source en.comix --source en.comixws
      - name: Retain candidate packages and exact functional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reader-repair-${{ github.sha }}
          path: |
            reader-candidates
            acceptance/functional
          if-no-files-found: warn
          retention-days: 30
